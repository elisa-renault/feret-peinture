server {
    listen 80;
    listen [::]:80;
    server_name feret-peinture.fr www.feret-peinture.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://feret-peinture.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.feret-peinture.fr;
    ssl_certificate /etc/letsencrypt/live/feret-peinture.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feret-peinture.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://feret-peinture.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name feret-peinture.fr;
    ssl_certificate /etc/letsencrypt/live/feret-peinture.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feret-peinture.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Public baseline. Keep this configuration aligned with the live site.
    # A staging-only password gate and noindex policy belong in a separate server block.
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    client_max_body_size 20m;

    location ~ /\. { deny all; }
    location = /wp-config.php { deny all; }
    location = /xmlrpc.php { deny all; }
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }

    # Theme and first-party plugin assets carry a file version in their URLs.
    # They can therefore be cached for a year without delaying a deployment.
    location ~* ^/wp-content/(themes/feret-peinture|plugins/feret-peinture-core)/.+\.(?:css|js|svg|woff2|png|jpe?g|webp|avif)$ {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Uploaded photographs may be replaced at the same URL: keep the browser
    # cache useful, but short enough for an editorial correction to propagate.
    location ~* ^/wp-content/uploads/.+\.(?:png|jpe?g|webp|avif|gif)$ {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
    }
}
