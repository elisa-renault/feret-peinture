server {
    listen 80;
    listen [::]:80;
    server_name feret-peinture.fr www.feret-peinture.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://feret-peinture.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.feret-peinture.fr;
    ssl_certificate /etc/letsencrypt/live/feret-peinture.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feret-peinture.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://feret-peinture.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name feret-peinture.fr;
    ssl_certificate /etc/letsencrypt/live/feret-peinture.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feret-peinture.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Temporary preview gate. Remove only when public launch is requested.
    auth_basic "Feret Peinture - Apercu prive";
    auth_basic_user_file /etc/nginx/feret-peinture.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 20m;

    location ~ /\. { deny all; }
    location = /wp-config.php { deny all; }
    location = /xmlrpc.php { deny all; }
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
    }
}
